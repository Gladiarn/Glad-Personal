name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, links and plugin manifest
        run: node scripts/validate-skills.mjs
      - name: Catalog is up to date
        run: |
          node scripts/build-catalog.js
          git diff --exit-code -- catalog/README.md
      - name: Installer parses
        run: bash -n install.sh
